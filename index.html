<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iYadvik Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="manifest" href="manifest.json">
</head>
<script>
    if('serviceWorker' in navigator){
        navigator.serviceWorker.register('sw.js');
    }
</script>


<body>
    <div id="loader">
    <img id="loaderBg" src="Imagebackground (3).png" alt="Loading Background">
    
    <div id="loaderBox">
        <h2 style="font-family: sans-serif; font-size: 24px; margin-bottom: 10px; text-shadow: 2px 2px 4px #000;">Loading Bheem Adventure...</h2>
        <div id="loaderBar">
            <div id="loaderFill"></div>
        </div>
        <p id="loaderText" style="font-family: sans-serif; font-size: 20px; font-weight: bold; color: #ffcc00; margin-top: 10px; text-shadow: 1px 1px 3px #000;">0%</p>
    </div>
</div>
    <div class="gamecontainer">
        <!--<div class="gameOver"><H6>Welcome to Bheem - Created by Ritesh Parashar</H6> </div>-->
        <div class="gameOver">
            <H6>Welcome to Bheem Adventure</H6>
        </div>
        <div class="dino"></div>
        <div id="scoreCont">Your score: 0</div>
        <div class="obstacle obstacleAni"></div>
        <div id="restartBox" style="display: none;">
            <p>Game Over!</p>
            <button id="restartBtn">Play Again</button>
        </div>



    </div>

</body>

</html>
